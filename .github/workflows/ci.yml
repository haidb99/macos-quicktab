name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-swift-
      - name: Build release
        run: swift build -c release
      - name: Run core checks
        run: swift run -c release QuickTabChecks
      - name: Run XCTest
        run: swift test
      - name: Validate scripts and metadata
        run: |
          bash -n build.sh run.sh package-dmg.sh
          plutil -lint Resources/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Resources/Info.plist)" = "com.local.quicktab"
          git diff --check
